<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA 토토 도우미</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>NBA 토토 도우미</h1>
    <span class="updated" id="updated"></span>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="predict" class="active">경기 예측</button>
    <button data-tab="players">선수 통계</button>
    <button data-tab="teams">팀 통계</button>
    <button data-tab="help">모델 설명 · 설정</button>
  </nav>
</header>

<main id="app">
  <!-- 경기 예측 -->
  <section id="tab-predict" class="tab active">
    <div class="predict-layout">
      <aside class="games-panel">
        <div class="panel-head">
          <h2>경기 일정 <small>(한국 시간)</small></h2>
          <label class="chk"><input type="checkbox" id="showFinal"> 끝난 경기도 보기</label>
        </div>
        <div id="gamesList" class="games-list"></div>
      </aside>

      <div class="predict-main">
        <div class="card matchup-pick">
          <div class="pick-row">
            <label>원정 <select id="awaySel"></select></label>
            <button id="swapBtn" class="ghost" title="홈/원정 바꾸기">⇄</button>
            <label>홈 <select id="homeSel"></select></label>
          </div>
          <div class="pick-row opts">
            <label class="chk"><input type="checkbox" id="neutral"> 중립 경기장</label>
            <label class="chk"><input type="checkbox" id="b2bAway"> 원정팀 백투백</label>
            <label class="chk"><input type="checkbox" id="b2bHome"> 홈팀 백투백</label>
            <label class="num">원정 보정 <input type="number" id="adjAway" step="0.5" value="0"></label>
            <label class="num">홈 보정 <input type="number" id="adjHome" step="0.5" value="0"></label>
            <button id="resetInj" class="ghost small">부상 설정 초기화</button>
          </div>
        </div>

        <div id="result" class="card result"></div>

        <div class="card calc">
          <h3>토토 배당 계산기 <small>배당은 소수 배당(예: 1.85)으로 입력하세요. 비워두면 확률만 표시돼요.</small></h3>
          <div class="calc-grid">
            <div class="calc-box">
              <h4>승패</h4>
              <div class="inrow"><label>원정 승 배당 <input type="number" step="0.01" id="oddAway"></label>
                <label>홈 승 배당 <input type="number" step="0.01" id="oddHome"></label></div>
              <div id="outML"></div>
            </div>
            <div class="calc-box">
              <h4>핸디캡 <small>(홈팀 기준, 예: -3.5)</small></h4>
              <div class="inrow"><label>홈 핸디 <input type="number" step="0.5" id="hcLine"></label>
                <label>핸디 승 배당 <input type="number" step="0.01" id="oddHcH"></label>
                <label>핸디 패 배당 <input type="number" step="0.01" id="oddHcA"></label></div>
              <div id="outHC"></div>
            </div>
            <div class="calc-box">
              <h4>언더오버</h4>
              <div class="inrow"><label>기준점 <input type="number" step="0.5" id="ouLine"></label>
                <label>오버 배당 <input type="number" step="0.01" id="oddOver"></label>
                <label>언더 배당 <input type="number" step="0.01" id="oddUnder"></label></div>
              <div id="outOU"></div>
            </div>
          </div>
          <div id="lineTables" class="line-tables"></div>
        </div>

        <div class="rosters">
          <div class="card roster" id="rosterAway"></div>
          <div class="card roster" id="rosterHome"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 선수 통계 -->
  <section id="tab-players" class="tab">
    <div class="card toolbar">
      <label>팀 <select id="pTeam"><option value="">전체</option></select></label>
      <label>시즌 <select id="pMode"></select></label>
      <label>최소 경기 <input type="number" id="pMinG" value="1" min="0" style="width:4em"></label>
      <label>검색 <input type="search" id="pSearch" placeholder="선수 이름"></label>
      <label class="chk"><input type="checkbox" id="pInjOnly"> 부상자만</label>
      <label class="chk"><input type="checkbox" id="pHeat" checked> 색상 표시</label>
      <span class="spacer"></span>
      <span id="pCount" class="muted"></span>
      <button id="pCsv">엑셀(CSV) 저장</button>
    </div>
    <div class="table-wrap" id="pTableWrap"></div>
  </section>

  <!-- 팀 통계 -->
  <section id="tab-teams" class="tab">
    <div class="card toolbar">
      <span class="muted">팀 이름을 누르면 그 팀 선수 통계로 이동해요. 모델 레이팅은 지금 체크된 부상자를 반영한 100포제션당 점수 마진입니다.</span>
      <span class="spacer"></span>
      <button id="tCsv">엑셀(CSV) 저장</button>
    </div>
    <div class="table-wrap" id="tTableWrap"></div>
  </section>

  <!-- 설명 -->
  <section id="tab-help" class="tab">
    <div class="help-grid">
      <div class="card">
        <h2>모델 설정</h2>
        <div id="settingsForm" class="settings"></div>
        <button id="resetSettings" class="ghost">기본값으로</button>
      </div>
      <div class="card prose" id="helpText"></div>
    </div>
  </section>
</main>

<footer class="foot">
  통계 기반 참고용 예측이며 결과를 보장하지 않습니다. 베팅은 합법 사이트(베트맨)에서, 감당할 수 있는 범위 안에서만 하세요.
  데이터: Basketball-Reference, ESPN
</footer>

<script src="data/nba_data.js"></script>
<script src="app.js"></script>
</body>
</html>
